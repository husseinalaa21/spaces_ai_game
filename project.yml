name: AI
options:
  bundleIdPrefix: com.husseinalaa.ai
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    SUPPORTS_MACCATALYST: false
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
packages:
  # High-performance SwiftUI particle system (MIT, iOS 15+) — used by
  # DotEffectsLayer for the eat/absorb/level-up bursts.
  Vortex:
    url: https://github.com/twostraws/Vortex
    from: 1.0.0

targets:
  AI:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/AI
    dependencies:
      - package: Vortex
    resources:
      - path: Sources/AI/Resources/Assets.xcassets
      - path: Sources/AI/Resources/Sounds
    info:
      path: Sources/AI/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        CFBundleDisplayName: "Spaces - Dots Game"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacechat.ai
        DEVELOPMENT_TEAM: SVDD93966K
        PRODUCT_NAME: "Spaces - Dots Game"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: AI.entitlements
schemes:
  AI:
    build:
      targets:
        AI: all
    run:
      config: Debug
    archive:
      config: Release
